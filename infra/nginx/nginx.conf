worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Mapa para lidar com CORS de forma robusta
    map $http_origin $cors_origin {
        default "*";
    }

    server {
        listen       80;
        server_name  localhost;

        # Configurações globais de CORS para facilitar o desenvolvimento local
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Prefer,apikey,x-client-info,x-supabase-api-version,accept-profile,content-profile,x-retry-count' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Content-Location' always;

        # Preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # PostgREST (API)
        location /rest/v1/ {
            proxy_pass http://vesper-api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Remover cabeçalhos de CORS duplicados se o PostgREST enviar
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        # Auth Mock (Redirects to Next.js API Mock running on HOST)
        location /auth/v1/signup {
            proxy_pass http://host.docker.internal:3000/api/auth-mock/signup;
            proxy_set_header Host $host;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        location /auth/v1/token {
            proxy_pass http://host.docker.internal:3000/api/auth-mock/login;
            proxy_set_header Host $host;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        location /auth/v1/user {
            proxy_pass http://host.docker.internal:3000/api/auth-mock/user;
            proxy_set_header Host $host;
            proxy_hide_header 'Access-Control-Allow-Origin';
        }

        location /auth/v1/ {
            default_type application/json;
            return 200 '{"message":"Auth Mock Active"}';
        }
    }
}
