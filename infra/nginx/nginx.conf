worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # PostgREST (API)
        location /rest/v1/ {
            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Prefer, Range, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Location' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Prefer, Range, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Auth Mock (Redirects to Next.js API Mock running on HOST)
        location /auth/v1/signup {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count';
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            proxy_pass http://host.docker.internal:3000/api/auth-mock/signup;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location /auth/v1/token {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count';
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            proxy_pass http://host.docker.internal:3000/api/auth-mock/login;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location /auth/v1/user {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count';
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            proxy_pass http://host.docker.internal:3000/api/auth-mock/user;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location /auth/v1/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, accept-profile, content-profile, x-retry-count';
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 200 '{"message":"Auth Mock Active"}';
        }
    }
}
